version: 2

updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"

    open-pull-requests-limit: 10

    labels:
      - "dependencies"

    commit-message:
      prefix: "deps"

    groups:
      maven-dependencies:
        patterns:
          - "*"